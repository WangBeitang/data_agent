services:
  qdrant:
    image: qdrant/qdrant:v1.16.2
    container_name: data-agent-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - data_agent_qdrant:/qdrant/storage
    mem_limit: 512m

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.10
    container_name: data-agent-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: "-Xms384m -Xmx384m"
    ports:
      - "9200:9200"
    volumes:
      - data_agent_elasticsearch:/usr/share/elasticsearch/data
    mem_limit: 768m
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null || exit 1
      interval: 15s
      timeout: 8s
      retries: 12
      start_period: 45s

volumes:
  data_agent_qdrant:
  data_agent_elasticsearch:
